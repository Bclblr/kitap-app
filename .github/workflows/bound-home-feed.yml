name: Bound home feed
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bound-home-feed.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bound feed queries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/index.tsx')
          s=p.read_text()
          def add_limit_after(anchor):
              global s
              i=s.index(anchor)
              j=s.index(".order('created_at', { ascending: false });", i)
              old=".order('created_at', { ascending: false });"
              s=s[:j]+old.replace(';',"\n        .limit(30);")+s[j+len(old):]
          add_limit_after("const loadReviews = useCallback")
          add_limit_after("const loadPosts = useCallback")
          i=s.index("const { data: reviewData")
          j=s.index(".order('created_at', { ascending: false });", i)
          old=".order('created_at', { ascending: false });"
          s=s[:j]+old.replace(';',"\n        .limit(30);")+s[j+len(old):]
          s=s.replace(".limit(100);\n      if (remoteQuotes.error)", ".limit(30);\n      if (remoteQuotes.error)", 1)
          p.write_text(s)
          PY
      - run: npm ci
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Route audit
        run: npm run audit:routes
      - name: Reader security tests
        run: npm run test:security
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/index.tsx
          git commit -m "Bound home feed queries" || true
          git rm .github/workflows/bound-home-feed.yml
          git commit -m "Remove temporary bounded feed workflow" || true
          git push
