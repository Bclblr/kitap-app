name: Apply hashtag text renderer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hashtag-text.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch hashtag page text rendering
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/app/hashtag.tsx')
          text = path.read_text(encoding='utf-8')

          import_anchor = "import { useThemedStyles } from '@/theme/use-themed-styles';\n"
          import_line = "import HashtagText from '@/components/HashtagText';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old_body = "        {item.text ? <Text style={styles.bodyText}>{item.text}</Text> : null}"
          new_body = "        {item.text ? <HashtagText text={item.text} style={styles.bodyText} /> : null}"
          if old_body not in text:
              raise SystemExit('Body text anchor not found')
          text = text.replace(old_body, new_body, 1)

          old_comment = "                      <Text style={styles.commentContent}>{comment.text}</Text>"
          new_comment = "                      <HashtagText text={comment.text} style={styles.commentContent} />"
          if old_comment in text:
              text = text.replace(old_comment, new_comment, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/hashtag.tsx
          git commit -m "Hashtag sayfasında etiketleri tıklanabilir yap"
          git push
