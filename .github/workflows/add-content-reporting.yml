name: Add content reporting

on:
  push:
    paths:
      - '.github/workflows/add-content-reporting.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply content reporting patch
        run: python3 scripts/apply-content-reporting.py
      - run: npm ci
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/index.tsx
          git commit -m "Add feed content reporting" || true
          git rm .github/workflows/add-content-reporting.yml scripts/apply-content-reporting.py
          git commit -m "Remove temporary content reporting patch" || true
          git push origin main
