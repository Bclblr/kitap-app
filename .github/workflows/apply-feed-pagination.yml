name: Apply feed pagination
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-feed-pagination.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply feed pagination patch
        run: python3 scripts/add-feed-pagination.py
      - run: npm ci
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Route audit
        run: npm run audit:routes
      - name: Reader security tests
        run: npm run test:security
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/index.tsx
          git commit -m "Add incremental home feed loading" || true
          git rm scripts/add-feed-pagination.py .github/workflows/apply-feed-pagination.yml
          git commit -m "Remove temporary feed pagination files" || true
          git push
