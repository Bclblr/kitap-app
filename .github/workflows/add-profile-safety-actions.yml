name: Add profile safety actions

on:
  push:
    paths:
      - 'scripts/add-profile-safety-actions.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch profile
        run: python3 scripts/add-profile-safety-actions.py
      - run: npm ci
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/profile.tsx
          git commit -m "Add profile report and block actions"
          git rm scripts/add-profile-safety-actions.py .github/workflows/add-profile-safety-actions.yml
          git commit -m "Remove temporary profile safety patch"
          git push origin main
