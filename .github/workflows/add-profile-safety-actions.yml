name: Add profile safety actions

on:
  push:
    paths:
      - '.github/workflows/add-profile-safety-actions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch profile safety actions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/profile.tsx')
          s = p.read_text()

          old = """  const [followLoading, setFollowLoading] = useState(false);\n\n  const [reviews, setReviews] = useState<Review[]>([]);"""
          new = """  const [followLoading, setFollowLoading] = useState(false);\n  const [safetyLoading, setSafetyLoading] = useState(false);\n\n  const [reviews, setReviews] = useState<Review[]>([]);"""
          if old not in s: raise SystemExit('state anchor not found')
          s = s.replace(old, new, 1)

          anchor = """  /*\n   * ============================================================\n   * İNCELEMELER\n   * ============================================================\n   */"""
          funcs = r'''  async function reportProfile() {
    const loggedInUserId = await getCurrentUserId();
    const targetUserId = typeof userId === 'string' && userId ? userId : null;

    if (!loggedInUserId) {
      Alert.alert('Giriş gerekli', 'Şikâyet göndermek için giriş yapmalısın.');
      return;
    }
    if (!targetUserId || targetUserId === loggedInUserId) return;

    Alert.alert(
      'Kullanıcıyı şikâyet et',
      'Şikâyet nedenini seç.',
      [
        ['Spam', 'spam'],
        ['Taciz', 'harassment'],
        ['Uygunsuz içerik', 'inappropriate'],
        ['Taklit / sahte hesap', 'impersonation'],
        ['Diğer', 'other'],
      ].map(([text, category]) => ({
        text,
        onPress: async () => {
          try {
            setSafetyLoading(true);
            const { error } = await supabase.from('user_reports').insert({
              reporter_id: loggedInUserId,
              reported_id: targetUserId,
              category,
              description: '',
            });
            if (error) throw error;
            Alert.alert('Şikâyet alındı', 'Bildirimin inceleme için gönderildi.');
          } catch (error) {
            console.error('Kullanıcı şikâyeti gönderilemedi:', error);
            Alert.alert('Hata', 'Şikâyet gönderilemedi.');
          } finally {
            setSafetyLoading(false);
          }
        },
      })).concat([{ text: 'Vazgeç', style: 'cancel' as const }])
    );
  }

  async function blockProfile() {
    const loggedInUserId = await getCurrentUserId();
    const targetUserId = typeof userId === 'string' && userId ? userId : null;

    if (!loggedInUserId) {
      Alert.alert('Giriş gerekli', 'Kullanıcı engellemek için giriş yapmalısın.');
      return;
    }
    if (!targetUserId || targetUserId === loggedInUserId) return;

    Alert.alert(
      'Kullanıcıyı engelle',
      `@${profile.username} hesabını engellemek istiyor musun?`,
      [
        { text: 'Vazgeç', style: 'cancel' },
        {
          text: 'Engelle',
          style: 'destructive',
          onPress: async () => {
            try {
              setSafetyLoading(true);
              const { error } = await supabase.from('user_blocks').insert({
                blocker_id: loggedInUserId,
                blocked_id: targetUserId,
              });
              if (error && error.code !== '23505') throw error;

              await supabase
                .from('follows')
                .delete()
                .or(`and(follower_id.eq.${loggedInUserId},following_id.eq.${targetUserId}),and(follower_id.eq.${targetUserId},following_id.eq.${loggedInUserId})`);

              Alert.alert('Engellendi', 'Bu kullanıcıyla etkileşim kısıtlandı.', [
                { text: 'Tamam', onPress: () => router.replace('/profile') },
              ]);
            } catch (error) {
              console.error('Kullanıcı engellenemedi:', error);
              Alert.alert('Hata', 'Kullanıcı engellenemedi.');
            } finally {
              setSafetyLoading(false);
            }
          },
        },
      ]
    );
  }

  function openSafetyMenu() {
    Alert.alert('Profil seçenekleri', `@${profile.username}`, [
      { text: 'Şikâyet Et', onPress: reportProfile },
      { text: 'Engelle', style: 'destructive', onPress: blockProfile },
      { text: 'Vazgeç', style: 'cancel' },
    ]);
  }

'''
          if anchor not in s: raise SystemExit('function anchor not found')
          s = s.replace(anchor, funcs + anchor, 1)

          old_actions = """              <Pressable\n                onPress={() => {\n                  if (!profile?.id) { Alert.alert('Hata', 'Kullanıcı bulunamadı.'); return; }\n                  router.push({ pathname: '/chat', params: { userId: profile.id, username: profile.username || 'Kitap Okuru' } });\n                }}\n                style={styles.messageButton}\n              ><Text style={styles.messageButtonText}>💬 Mesaj</Text></Pressable>"""
          new_actions = old_actions + """\n              <Pressable\n                onPress={openSafetyMenu}\n                disabled={safetyLoading}\n                style={styles.messageButton}\n                accessibilityLabel=\"Profil seçenekleri\"\n              ><Text style={styles.messageButtonText}>{safetyLoading ? '...' : '⋯'}</Text></Pressable>"""
          if old_actions not in s: raise SystemExit('action anchor not found')
          s = s.replace(old_actions, new_actions, 1)
          p.write_text(s)
          PY
      - run: npm ci
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/profile.tsx
          git commit -m "Add profile report and block actions"
          git rm .github/workflows/add-profile-safety-actions.yml
          git commit -m "Remove temporary profile safety workflow"
          git push origin main
