name: Apply Premium quote cards

on:
  push:
    paths:
      - '.github/workflows/apply-premium-quote-cards.yml'
      - 'scripts/patch-premium-quote-cards.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python scripts/patch-premium-quote-cards.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/premium.tsx src/app/_layout.tsx src/app/index.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Apply Premium quote card templates"
          git push origin main
