name: Apply private profile integration
on:
  push:
    paths:
      - 'scripts/apply-private-profile.cjs'
      - '.github/workflows/apply-private-profile.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply private profile changes
        run: node scripts/apply-private-profile.cjs
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Route audit
        run: npm run audit:routes
      - name: Reader security tests
        run: npm run test:security
      - name: Commit changes
        run: |
          if git diff --quiet -- src/app/profile.tsx; then
            echo 'No profile changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/profile.tsx
          git commit -m 'Integrate private account follow requests'
          git push
