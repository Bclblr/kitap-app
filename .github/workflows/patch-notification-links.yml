name: Patch notification links
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-notification-links.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Add interaction notification deep links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/notifications.tsx')
          s=p.read_text()
          anchor="""  async function markAsRead(notification: NotificationItem) {\n"""
          helper="""  function openNotificationTarget(notification: NotificationItem) {\n    if (notification.source === 'admin') {\n      if (notification.action_route) router.push(notification.action_route as never);\n      return;\n    }\n\n    if (notification.post_id) {\n      router.push({ pathname: '/content', params: { type: 'post', id: notification.post_id } } as never);\n      return;\n    }\n\n    if (notification.review_id) {\n      router.push({ pathname: '/content', params: { type: 'review', id: notification.review_id } } as never);\n    }\n  }\n\n"""
          if 'function openNotificationTarget' not in s:
              if anchor not in s: raise SystemExit('markAsRead anchor missing')
              s=s.replace(anchor,helper+anchor,1)
          old="""    if (notification.read) {\n      if (notification.source === 'admin' && notification.action_route) {\n        router.push(notification.action_route as never);\n      }\n      return;\n    }\n"""
          new="""    if (notification.read) {\n      openNotificationTarget(notification);\n      return;\n    }\n"""
          if old in s:
              s=s.replace(old,new,1)
          old2="""      if (notification.source === 'admin' && notification.action_route) {\n        router.push(notification.action_route as never);\n      }\n"""
          if old2 in s:
              s=s.replace(old2,"      openNotificationTarget(notification);\n",1)
          p.write_text(s)

          c=Path('src/app/content.tsx')
          t=c.read_text()
          t=t.replace("import BookCover from '@/components/BookCover';\n",'')
          old_cover="""                <BookCover book={{ key: content.book_key, title: content.book_title }} style={styles.cover} />"""
          new_cover="""                <View style={styles.cover}><Feather name=\"book-open\" size={24} color={colors.primary} /></View>"""
          if old_cover in t:
              t=t.replace(old_cover,new_cover,1)
          c.write_text(t)
          PY
      - run: npm ci
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Route audit
        run: npm run audit:routes
      - name: Reader security tests
        run: npm run test:security
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/notifications.tsx src/app/content.tsx
          git commit -m "Add notification content deep links" || true
          git rm .github/workflows/patch-notification-links.yml
          git commit -m "Remove temporary notification patch workflow" || true
          git push
