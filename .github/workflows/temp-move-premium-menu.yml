name: Move Premium menu entry

on:
  push:
    paths:
      - '.github/workflows/temp-move-premium-menu.yml'

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply change
        run: |
          echo '' | base64 -d > /tmp/move_premium.py
          python /tmp/move_premium.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/index.tsx src/app/profile-settings.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: move Premium entry to home drawer"
          git push
