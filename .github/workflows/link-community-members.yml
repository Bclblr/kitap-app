name: Link community members
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/link-community-members.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Link full member list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/community.tsx')
          s = p.read_text()
          old = '''        <Text style={styles.section}>Üyeler</Text>\n\n        {members.length ? ('''
          new = '''        <View style={styles.membersSectionHeader}>\n          <Text style={styles.section}>Üyeler</Text>\n          {memberCount > 0 ? (\n            <Pressable\n              onPress={() =>\n                router.push({\n                  pathname: "/community-members",\n                  params: { id: communityId },\n                })\n              }\n              accessibilityRole="button"\n              accessibilityLabel="Tüm topluluk üyelerini gör"\n            >\n              <Text style={styles.membersSeeAll}>Tümünü Gör</Text>\n            </Pressable>\n          ) : null}\n        </View>\n\n        {members.length ? ('''
          if old not in s:
              raise SystemExit('Members section marker not found')
          s = s.replace(old, new, 1)
          style_marker = '''  section: {'''
          style_insert = '''  membersSectionHeader: {\n    flexDirection: "row",\n    alignItems: "center",\n    justifyContent: "space-between",\n    marginTop: 22,\n    marginBottom: 10,\n  },\n  membersSeeAll: {\n    color: "#B58AF6",\n    fontSize: 13,\n    fontWeight: "800",\n    paddingVertical: 8,\n    paddingLeft: 12,\n  },\n  section: {'''
          if style_marker not in s:
              raise SystemExit('Section style marker not found')
          s = s.replace(style_marker, style_insert, 1)
          p.write_text(s)
          PY
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Route audit
        run: npm run audit:routes
      - name: Reader security tests
        run: npm run test:security
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/community.tsx
          git commit -m "Link full community member list" || true
          git rm .github/workflows/link-community-members.yml
          git commit -m "Remove temporary community member workflow" || true
          git push
