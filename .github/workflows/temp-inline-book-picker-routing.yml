name: Inline composer book picker routing

on:
  push:
    paths:
      - '.github/workflows/temp-inline-book-picker-routing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch review, home and book detail
        shell: python
        run: |
          from pathlib import Path

          # Review composer: internal book picker.
          p = Path('src/app/review.tsx')
          s = p.read_text(encoding='utf-8')

          old = "import BookCover from '@/components/BookCover';\n"
          new = "import BookCover from '@/components/BookCover';\nimport BookPickerModal, { ComposerBook } from '@/components/BookPickerModal';\n"
          if old not in s:
              raise SystemExit('review import anchor not found')
          s = s.replace(old, new, 1)

          old = """  const [rating, setRating] = useState(0);\n"""
          new = """  const [selectedBookKey, setSelectedBookKey] = useState(key ?? '');\n  const [selectedBookTitle, setSelectedBookTitle] = useState(title ?? '');\n  const [selectedBookAuthor, setSelectedBookAuthor] = useState(author ?? '');\n  const [selectedBookCover, setSelectedBookCover] = useState(coverUrl ?? '');\n  const [bookPickerOpen, setBookPickerOpen] = useState(false);\n\n  const [rating, setRating] = useState(0);\n"""
          if old not in s:
              raise SystemExit('review state anchor not found')
          s = s.replace(old, new, 1)

          old = """    if (!key) {\n      Alert.alert('Hata', 'Kitap bilgisi bulunamadı.');\n      return;\n    }\n"""
          new = """    if (!selectedBookKey) {\n      Alert.alert('Kitap gerekli', 'İnceleme için önce bir kitap seçmelisin.');\n      setBookPickerOpen(true);\n      return;\n    }\n"""
          if old not in s:
              raise SystemExit('review validation anchor not found')
          s = s.replace(old, new, 1)

          old = """        book_key: key,\n        book_title: title || 'Bilinmeyen kitap',\n"""
          new = """        book_key: selectedBookKey,\n        book_title: selectedBookTitle || 'Bilinmeyen kitap',\n"""
          if old not in s:
              raise SystemExit('review insert anchor not found')
          s = s.replace(old, new, 1)

          old = """        <View style={styles.bookCard}>\n          <BookCover uri={coverUrl || null} style={styles.bookCover}>\n            <View style={styles.bookCoverFallback}><Feather name=\"book-open\" size={22} color=\"#797F8B\" /></View>\n          </BookCover>\n          <View style={styles.bookCopy}>\n            <Text style={styles.bookEyebrow}>İNCELEME YAPILAN KİTAP</Text>\n            <Text style={styles.bookTitle} numberOfLines={2}>{title || 'Bilinmeyen kitap'}</Text>\n            <Text style={styles.bookAuthor} numberOfLines={1}>{author || 'Kitap detayı'}</Text>\n          </View>\n          <Feather name=\"check-circle\" size={20} color=\"#8C70E8\" />\n        </View>\n"""
          new = """        <Pressable onPress={() => setBookPickerOpen(true)} style={styles.bookCard}>\n          <BookCover uri={selectedBookCover || null} style={styles.bookCover}>\n            <View style={styles.bookCoverFallback}><Feather name=\"book-open\" size={22} color=\"#797F8B\" /></View>\n          </BookCover>\n          <View style={styles.bookCopy}>\n            <Text style={styles.bookEyebrow}>İNCELEME YAPILAN KİTAP</Text>\n            <Text style={styles.bookTitle} numberOfLines={2}>{selectedBookTitle || 'Kitap seç'}</Text>\n            <Text style={styles.bookAuthor} numberOfLines={1}>{selectedBookAuthor || 'Kitap veya yazar adıyla ara'}</Text>\n          </View>\n          <Feather name={selectedBookKey ? \"check-circle\" : \"plus-circle\"} size={20} color=\"#8C70E8\" />\n        </Pressable>\n"""
          if old not in s:
              raise SystemExit('review book card anchor not found')
          s = s.replace(old, new, 1)

          old = """      <Modal visible={topicSheet} transparent animationType=\"slide\" onRequestClose={() => setTopicSheet(false)}>\n"""
          new = """      <BookPickerModal\n        visible={bookPickerOpen}\n        onClose={() => setBookPickerOpen(false)}\n        title=\"İnceleme için kitap seç\"\n        onSelect={(selected: ComposerBook) => {\n          setSelectedBookKey(selected.key);\n          setSelectedBookTitle(selected.title);\n          setSelectedBookAuthor(selected.author);\n          setSelectedBookCover(selected.coverUrl ?? '');\n        }}\n      />\n\n      <Modal visible={topicSheet} transparent animationType=\"slide\" onRequestClose={() => setTopicSheet(false)}>\n"""
          if old not in s:
              raise SystemExit('review modal anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Home composer menu: open review composer directly.
          p = Path('src/app/index.tsx')
          s = p.read_text(encoding='utf-8')
          old = "<Action label=\"Kitap İncelemesi Yaz\" onPress={() => { setCreateMenu(false); router.push('/explore'); }} />"
          new = "<Action label=\"Kitap İncelemesi Yaz\" onPress={() => { setCreateMenu(false); router.push('/review'); }} />"
          if old not in s:
              raise SystemExit('home review action not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Book detail: alıntı action opens the full quote composer instead of inline editor.
          p = Path('src/app/book.tsx')
          s = p.read_text(encoding='utf-8')
          old = """            <Pressable onPress={() => setShowQuoteBox((current) => !current)} style={styles.actionCard}>\n              <View style={styles.actionIcon}>\n                <Feather name=\"type\" size={20} color=\"#C8B6FF\" />\n              </View>\n              <View style={styles.actionCopy}>\n                <Text style={styles.actionTitle}>Alıntı Ekle</Text>\n                <Text style={styles.actionSubtitle}>Altını çizdiğin bir bölümü kaydet</Text>\n              </View>\n              <Feather name={showQuoteBox ? 'chevron-up' : 'chevron-right'} size={20} color=\"#707784\" />\n            </Pressable>\n"""
          new = """            <Pressable\n              onPress={() => router.push({\n                pathname: '/quote-create',\n                params: {\n                  key,\n                  book: book.title ?? 'Bilinmeyen kitap',\n                  author: authorNames,\n                  coverUrl: coverUrl ?? undefined,\n                },\n              })}\n              style={styles.actionCard}\n            >\n              <View style={styles.actionIcon}>\n                <Feather name=\"type\" size={20} color=\"#C8B6FF\" />\n              </View>\n              <View style={styles.actionCopy}>\n                <Text style={styles.actionTitle}>Alıntı Ekle</Text>\n                <Text style={styles.actionSubtitle}>Altını çizdiğin bir bölümü paylaş</Text>\n              </View>\n              <Feather name=\"chevron-right\" size={20} color=\"#707784\" />\n            </Pressable>\n"""
          if old not in s:
              raise SystemExit('book quote action not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/review.tsx src/app/index.tsx src/app/book.tsx
          git commit -m "feat: select books inside review and quote composers"
          git push
