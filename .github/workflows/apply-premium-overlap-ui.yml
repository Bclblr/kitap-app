name: Apply Premium overlap UI

on:
  push:
    paths:
      - '.github/workflows/apply-premium-overlap-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Premium overlap labels
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app/premium.tsx')
          s = p.read_text()
          old = """  const paidLabel = premium.paidSources.includes('apple')\n    ? 'Apple üzerinden Premium'\n    : premium.paidSources.includes('google')\n      ? 'Google Play üzerinden Premium'\n      : premium.hasAdminPremium\n        ? 'Admin tarafından verilen Premium'\n        : 'Premium üyelik';\n"""
          new = """  const paidLabel = premium.hasPaidPremium && premium.hasAdminPremium\n    ? 'Ücretli + admin Premium'\n    : premium.paidSources.includes('apple') && premium.paidSources.includes('google')\n      ? 'Apple + Google Play üzerinden Premium'\n      : premium.paidSources.includes('apple')\n        ? 'Apple üzerinden Premium'\n        : premium.paidSources.includes('google')\n          ? 'Google Play üzerinden Premium'\n          : premium.hasAdminPremium\n            ? 'Admin tarafından verilen Premium'\n            : 'Premium üyelik';\n"""
          if old not in s:
              raise SystemExit('paidLabel block not found')
          s = s.replace(old, new)
          s = s.replace("? `${paidLabel} · Bitiş: ${formatDate(premium.nextExpirationAt)}`", "? `${paidLabel} · Erişim bitişi: ${formatDate(premium.nextExpirationAt)}`")
          p.write_text(s)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/premium.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Clarify overlapping Premium access in UI"
          git push origin main
