name: Wire personalized discovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/components/PersonalizedBookSuggestions.tsx'
      - '.github/workflows/wire-personalized-discovery.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Add personalized recommendations to Explore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/explore.tsx')
          s=p.read_text()
          imp="import PersonalizedBookSuggestions from '@/components/PersonalizedBookSuggestions';\nimport ReaderSuggestions from '@/components/ReaderSuggestions';\n"
          anchor="import AdSlot from '@/components/AdSlot';\n"
          if "PersonalizedBookSuggestions" not in s:
              s=s.replace(anchor, anchor+imp)
          target='''              </Text>\n\n              <View style={styles.sectionCard}>\n                <SectionHeader accent="#F29A45" title="Popüler Kitaplar" />'''
          replacement='''              </Text>\n\n              <PersonalizedBookSuggestions />\n              <ReaderSuggestions limit={8} />\n\n              <View style={styles.sectionCard}>\n                <SectionHeader accent="#F29A45" title="Popüler Kitaplar" />'''
          if '<PersonalizedBookSuggestions />' not in s:
              if target not in s:
                  raise SystemExit('Explore discovery insertion anchor not found')
              s=s.replace(target,replacement,1)
          p.write_text(s)
          PY
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Route audit
        run: npm run audit:routes
      - name: Reader security tests
        run: npm run test:security
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/explore.tsx
          git diff --cached --quiet || git commit -m 'Show personalized books and readers in Explore'
          git push
