name: Account lifecycle UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/account-lifecycle-ui.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Wire verification and deletion UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          login = Path('src/app/login.tsx')
          text = login.read_text(encoding='utf-8')
          old = """      if (error) {\n        Alert.alert('Giriş başarısız', error.message);\n        return;\n      }\n"""
          new = """      if (error) {\n        const message = error.message.toLowerCase();\n        if (message.includes('email not confirmed') || message.includes('email_not_confirmed')) {\n          router.push({ pathname: '/verify-email', params: { email: cleanEmail } });\n          return;\n        }\n        Alert.alert('Giriş başarısız', error.message);\n        return;\n      }\n"""
          if old not in text:
              raise SystemExit('login error block not found')
          login.write_text(text.replace(old, new, 1), encoding='utf-8')

          register = Path('src/app/register.tsx')
          text = register.read_text(encoding='utf-8')
          text = text.replace("if (password.length < 6) {\n      Alert.alert('Şifre çok kısa', 'Şifren en az 6 karakter olmalı.');", "if (password.length < 8) {\n      Alert.alert('Şifre çok kısa', 'Şifren en az 8 karakter olmalı.');", 1)
          old = """      Alert.alert(\n        'Kayıt başarılı 🎉',\n        data.session ? 'Hesabın oluşturuldu.' : 'Hesabın oluşturuldu. E-postanı kontrol et.',\n        [{ text: 'Tamam', onPress: () => router.replace('/login') }]\n      );\n"""
          new = """      if (!data.session) {\n        router.replace({\n          pathname: '/verify-email',\n          params: { email: cleanEmail },\n        });\n        return;\n      }\n\n      Alert.alert('Kayıt başarılı 🎉', 'Hesabın oluşturuldu.', [\n        { text: 'Tamam', onPress: () => router.replace('/') },\n      ]);\n"""
          if old not in text:
              raise SystemExit('register success block not found')
          register.write_text(text.replace(old, new, 1), encoding='utf-8')

          settings = Path('src/app/profile-settings.tsx')
          text = settings.read_text(encoding='utf-8')
          old = """  async function handleLogout() {\n    const { error } = await supabase.auth.signOut();\n\n    if (error) {\n      Alert.alert('Hata', 'Çıkış yapılırken bir hata oluştu.');\n      return;\n    }\n\n    router.replace('/login');\n  }\n"""
          new = old + """\n  function confirmDeleteAccount() {\n    Alert.alert(\n      'Hesabı kalıcı olarak sil',\n      'Bu işlem geri alınamaz. Profilin ve hesabına bağlı veriler silinir.',\n      [\n        { text: 'Vazgeç', style: 'cancel' },\n        {\n          text: 'Hesabımı Sil',\n          style: 'destructive',\n          onPress: () => {\n            void deleteAccount();\n          },\n        },\n      ]\n    );\n  }\n\n  async function deleteAccount() {\n    setSaving(true);\n    try {\n      const { data: authData } = await supabase.auth.getUser();\n      if (!authData.user) {\n        router.replace('/login');\n        return;\n      }\n\n      const { error } = await supabase.rpc('delete_my_account');\n      if (error) {\n        console.error('Hesap silinemedi:', error);\n        Alert.alert('Hesap silinemedi', 'İşlem tamamlanamadı. Lütfen tekrar dene.');\n        return;\n      }\n\n      await supabase.auth.signOut().catch(() => undefined);\n      Alert.alert('Hesap silindi', 'Hesabın kalıcı olarak silindi.', [\n        { text: 'Tamam', onPress: () => router.replace('/login') },\n      ]);\n    } catch (error) {\n      console.error('Hesap silme hatası:', error);\n      Alert.alert('Hata', 'Hesap silinirken bir hata oluştu.');\n    } finally {\n      setSaving(false);\n    }\n  }\n"""
          if old not in text:
              raise SystemExit('logout block not found')
          text = text.replace(old, new, 1)

          old_ui = """        <Pressable onPress={handleLogout} style={styles.logoutButton}>\n          <Text style={styles.logoutText}>Çıkış Yap</Text>\n        </Pressable>\n"""
          new_ui = old_ui + """\n        <Pressable onPress={confirmDeleteAccount} disabled={saving} style={styles.deleteAccountButton}>\n          <Text style={styles.deleteAccountText}>Hesabımı Kalıcı Olarak Sil</Text>\n        </Pressable>\n"""
          if old_ui not in text:
              raise SystemExit('logout UI block not found')
          text = text.replace(old_ui, new_ui, 1)

          old_style = """  logoutText: {\n    color: '#FF747D',\n    fontSize: 14,\n    fontWeight: '800',\n    textAlign: 'center',\n  },\n});\n"""
          new_style = """  logoutText: {\n    color: '#FF747D',\n    fontSize: 14,\n    fontWeight: '800',\n    textAlign: 'center',\n  },\n  deleteAccountButton: {\n    alignSelf: 'center',\n    marginTop: 14,\n    paddingHorizontal: 22,\n    paddingVertical: 12,\n  },\n  deleteAccountText: {\n    color: '#A66A70',\n    fontSize: 12,\n    fontWeight: '700',\n    textAlign: 'center',\n    textDecorationLine: 'underline',\n  },\n});\n"""
          if old_style not in text:
              raise SystemExit('settings style tail not found')
          settings.write_text(text.replace(old_style, new_style, 1), encoding='utf-8')

          workflow = Path('.github/workflows/account-lifecycle-ui.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - run: npm ci
      - name: Verify TypeScript
        run: npm run typecheck

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Complete account lifecycle UI"
            git push origin main
          fi
