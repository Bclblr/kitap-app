name: Add saved screen entry
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-saved-entry.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Add saved menu entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/index.tsx')
          s=p.read_text()
          anchor="""              <Pressable onPress={() => { setShowAuthMenu(false); router.push('/profile-settings'); }} style={styles.drawerItem}>\n                <View style={styles.drawerIconWrap}><Feather name=\"settings\" size={22} color={colors.text} /></View>\n                <Text style={styles.drawerItemText}>Profil ayarları</Text>\n              </Pressable>\n"""
          saved="""              <Pressable onPress={() => { setShowAuthMenu(false); router.push('/saved'); }} style={styles.drawerItem}>\n                <View style={styles.drawerIconWrap}><Feather name=\"bookmark\" size={22} color={colors.text} /></View>\n                <Text style={styles.drawerItemText}>Kaydedilenler</Text>\n              </Pressable>\n"""
          if "router.push('/saved')" not in s:
              if anchor not in s: raise SystemExit('drawer anchor missing')
              s=s.replace(anchor, saved+anchor, 1)
          p.write_text(s)
          PY
      - run: npm ci
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Route audit
        run: npm run audit:routes
      - name: Reader security tests
        run: npm run test:security
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/index.tsx src/app/saved.tsx
          git commit -m "Expose saved content screen" || true
          git rm .github/workflows/add-saved-entry.yml
          git commit -m "Remove temporary saved screen workflow" || true
          git push
