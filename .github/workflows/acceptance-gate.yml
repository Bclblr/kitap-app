name: Acceptance gate

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Route audit
        run: npm run audit:routes
      - name: Reader security tests
        run: npm run test:security
      - name: Feed pagination regression
        run: npm run test:feed-pagination
      - name: Offline queue concurrency regression
        run: npm run test:async-key-lock
      - name: Notification offline cache-first audit
        run: npm run audit:notification-offline
      - name: Account cleanup race audit
        run: npm run audit:account-cleanup
      - name: Reader request race audit
        run: npm run audit:reader-request-race
      - name: Backend health monitoring audit
        run: npm run audit:backend-health-monitoring
      - name: Profile pagination audit
        run: npm run audit:profile-pagination
      - name: Admin analytics scope audit
        run: npm run audit:admin-analytics
      - name: Premium free-core audit
        run: npm run audit:premium-free-core
      - name: Premium lifecycle preflight
        run: npm run audit:premium-lifecycle
      - name: Ads configuration audit
        run: npm run audit:ads
      - name: Edge Function behavior audit
        run: npm run audit:edge-functions
      - name: Edge Function typecheck
        run: deno check supabase/functions/*/index.ts
      - name: RevenueCat transfer identity tests
        run: deno test supabase/functions/revenuecat-webhook/identity_test.ts
      - name: Release security audit
        run: npm run audit:release-security
      - name: Native release structural preflight
        run: npm run audit:native-release-preflight
      - name: Mobile auth preflight
        run: npm run audit:mobile-auth
      - name: Media upload preflight
        run: npm run audit:media-upload
      - name: Signed image cache audit
        run: npm run audit:signed-image-cache
      - name: Storage cleanup worker audit
        run: npm run audit:storage-cleanup-worker
      - name: Web bundle smoke build
        env:
          EXPO_PUBLIC_ADS_ENABLED: 'false'
          EXPO_PUBLIC_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ci_placeholder_key'
        run: npx expo export --platform web --output-dir dist-ci
      # Physical-device acceptance is intentionally tracked separately.
