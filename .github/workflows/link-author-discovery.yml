name: Link author discovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/app/author.tsx'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Link author cards to author detail
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/explore.tsx')
          s=p.read_text()
          start=s.index('  async function openAuthor(author: Author) {')
          end=s.index('\n\n  const selectedCount =', start)
          new="""  function openAuthor(author: Author) {
            if (!author.name) return;
            router.push({
              pathname: '/author',
              params: { key: author.key, name: author.name },
            });
          }"""
          p.write_text(s[:start]+new+s[end:])
          PY
      - run: npm ci
      - run: npm run typecheck
      - run: npm run audit:routes
      - run: npm run test:security
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/explore.tsx
          git diff --cached --quiet || git commit -m 'Link authors to discovery detail'
          git push
      - name: Remove temporary workflow
        run: |
          git pull --rebase
          git rm .github/workflows/link-author-discovery.yml
          git commit -m 'Remove temporary author discovery workflow'
          git push