name: Apply Premium screen links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-premium-screen-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply Premium screen links
        run: python .github/scripts/apply_premium_screen_links.py

      - name: Typecheck
        run: |
          npm ci
          npm run typecheck

      - name: Remove one-shot helpers
        run: rm -f .github/workflows/apply-premium-screen-links.yml .github/scripts/apply_premium_screen_links.py

      - name: Commit Premium screen links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Link Premium membership screen"
          git push
