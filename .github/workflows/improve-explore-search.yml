name: Improve explore search
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/improve-explore-search.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Improve search responsiveness and quality
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/explore.tsx')
          s=p.read_text()
          s=s.replace("  const searchRequestIdRef = useRef(0);\n  const skipNextSearchRef = useRef(false);", "  const searchRequestIdRef = useRef(0);\n  const searchAbortRef = useRef<AbortController | null>(null);\n  const searchCacheRef = useRef(new Map<string, { books: Book[]; users: UserProfile[]; authors: Author[] }>());\n  const skipNextSearchRef = useRef(false);")
          old="""    const requestId = ++searchRequestIdRef.current;
    setLoading(true);
    setSearched(true);
    setBooks([]);
    setUsers([]);
    setAuthors([]);

    try {
      const [userResult, bookResponse, authorResponse] = await Promise.all(["""
          new="""    const normalizedQuery = searchText.toLocaleLowerCase('tr-TR');
    const cached = searchCacheRef.current.get(normalizedQuery);
    if (cached) {
      setBooks(cached.books);
      setUsers(cached.users);
      setAuthors(cached.authors);
      setSearched(true);
      setLoading(false);
      return;
    }

    const requestId = ++searchRequestIdRef.current;
    searchAbortRef.current?.abort();
    const controller = new AbortController();
    searchAbortRef.current = controller;
    setLoading(true);
    setSearched(true);

    try {
      const [userResult, bookResponse, authorResponse] = await Promise.all(["""
          if old not in s: raise SystemExit('search start anchor missing')
          s=s.replace(old,new,1)
          s=s.replace("""        fetch(
          `https://openlibrary.org/search.json?q=${encodeURIComponent(searchText)}&limit=20&fields=key,title,author_name,cover_i,edition_key,isbn,first_publish_year`
        ),
        fetch(`https://openlibrary.org/search/authors.json?q=${encodeURIComponent(searchText)}&limit=10`),""", """        fetch(
          `https://openlibrary.org/search.json?q=${encodeURIComponent(searchText)}&limit=20&fields=key,title,author_name,cover_i,edition_key,isbn,first_publish_year`,
          { signal: controller.signal }
        ),
        fetch(`https://openlibrary.org/search/authors.json?q=${encodeURIComponent(searchText)}&limit=10`, { signal: controller.signal }),""",1)
          old2="""      setUsers(userResult.error ? [] : ((userResult.data ?? []) as UserProfile[]));

      if (bookResponse.ok) {
        const bookData = await bookResponse.json();
        setBooks(Array.isArray(bookData.docs) ? bookData.docs : []);
      }

      if (authorResponse.ok) {
        const authorData = await authorResponse.json();
        setAuthors(
          Array.isArray(authorData.docs)
            ? authorData.docs.map((author: any) => ({
                key: author.key || author.author_key?.[0],
                name: author.name,
                birth_date: author.birth_date,
                top_work: author.top_work,
                work_count: author.work_count,
              }))
            : []
        );
      }
    } catch (error) {
      console.error('Genel arama hatası:', error);
    } finally {
      if (requestId === searchRequestIdRef.current) setLoading(false);
    }"""
          new2="""      const nextUsers = userResult.error ? [] : ((userResult.data ?? []) as UserProfile[]);
      let nextBooks: Book[] = [];
      let nextAuthors: Author[] = [];

      if (bookResponse.ok) {
        const bookData = await bookResponse.json();
        const docs: Book[] = Array.isArray(bookData.docs) ? bookData.docs : [];
        nextBooks = docs
          .filter((item, index, all) => !!item.key && all.findIndex((candidate) => candidate.key === item.key) === index)
          .sort((a, b) => {
            const aq = (a.title ?? '').toLocaleLowerCase('tr-TR');
            const bq = (b.title ?? '').toLocaleLowerCase('tr-TR');
            const aExact = aq === normalizedQuery ? 1 : 0;
            const bExact = bq === normalizedQuery ? 1 : 0;
            const aStarts = aq.startsWith(normalizedQuery) ? 1 : 0;
            const bStarts = bq.startsWith(normalizedQuery) ? 1 : 0;
            return bExact - aExact || bStarts - aStarts;
          });
      }

      if (authorResponse.ok) {
        const authorData = await authorResponse.json();
        nextAuthors = Array.isArray(authorData.docs)
          ? authorData.docs.map((author: any) => ({
              key: author.key || author.author_key?.[0],
              name: author.name,
              birth_date: author.birth_date,
              top_work: author.top_work,
              work_count: author.work_count,
            }))
          : [];
      }

      if (requestId !== searchRequestIdRef.current) return;
      setUsers(nextUsers);
      setBooks(nextBooks);
      setAuthors(nextAuthors);
      searchCacheRef.current.set(normalizedQuery, { books: nextBooks, users: nextUsers, authors: nextAuthors });
      if (searchCacheRef.current.size > 20) {
        const oldestKey = searchCacheRef.current.keys().next().value;
        if (oldestKey) searchCacheRef.current.delete(oldestKey);
      }
      void supabase.rpc('log_search_event', {
        p_query: searchText,
        p_scope: 'explore',
        p_result_count: nextBooks.length + nextUsers.length + nextAuthors.length,
      });
    } catch (error) {
      if (error instanceof Error && error.name === 'AbortError') return;
      console.error('Genel arama hatası:', error);
    } finally {
      if (requestId === searchRequestIdRef.current) setLoading(false);
    }"""
          if old2 not in s: raise SystemExit('search result anchor missing')
          s=s.replace(old2,new2,1)
          s=s.replace("    void supabase.rpc('log_search_event', {\n      p_query: searchText,\n      p_scope: 'explore',\n      p_result_count: 0,\n    });\n\n",'',1)
          s=s.replace("    const timer = setTimeout(() => void searchAll(), 600);", "    const timer = setTimeout(() => void searchAll(), 350);")
          p.write_text(s)
          PY
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Route audit
        run: npm run audit:routes
      - name: Reader security tests
        run: npm run test:security
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/explore.tsx
          git diff --cached --quiet || git commit -m 'Improve explore search responsiveness and ranking'
          git push
