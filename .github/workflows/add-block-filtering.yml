name: Add blocked content filtering
on:
  push:
    paths:
      - '.github/workflows/add-block-filtering.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Filter blocked users from home feed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/index.tsx')
          s = p.read_text()

          anchor = """  async function getCurrentUserId() {\n    const user = await getCurrentUser();\n    return user?.id ?? null;\n  }\n"""
          helper = anchor + """\n  async function getBlockedUserIds(userId: string | null) {\n    const blocked = new Set<string>();\n    if (!userId) return blocked;\n\n    const { data, error } = await supabase\n      .from('user_blocks')\n      .select('blocker_id, blocked_id')\n      .or(`blocker_id.eq.${userId},blocked_id.eq.${userId}`);\n\n    if (error) {\n      console.error('Engellenen kullanıcılar alınamadı:', error);\n      return blocked;\n    }\n\n    for (const row of data ?? []) {\n      if (row.blocker_id === userId && row.blocked_id) blocked.add(row.blocked_id);\n      if (row.blocked_id === userId && row.blocker_id) blocked.add(row.blocker_id);\n    }\n\n    return blocked;\n  }\n"""
          if 'async function getBlockedUserIds' not in s:
              if anchor not in s: raise SystemExit('helper anchor missing')
              s = s.replace(anchor, helper, 1)

          old = """      const userId = await getCurrentUserId();\n\n      const { data, error } = await supabase\n        .from('reviews')"""
          new = """      const userId = await getCurrentUserId();\n      const blockedUserIds = await getBlockedUserIds(userId);\n\n      const { data, error } = await supabase\n        .from('reviews')"""
          if old in s:
              s = s.replace(old, new, 1)

          old = """        data.map(async (review: any) => {"""
          new = """        data.filter((review: any) => !review.user_id || !blockedUserIds.has(review.user_id)).map(async (review: any) => {"""
          if old in s:
              s = s.replace(old, new, 1)

          old = """            preparedComments = commentData.map((comment: any) => ({"""
          new = """            preparedComments = commentData\n              .filter((comment: any) => !comment.user_id || !blockedUserIds.has(comment.user_id))\n              .map((comment: any) => ({"""
          if old in s:
              s = s.replace(old, new, 1)

          old = """      const userId = await getCurrentUserId();\n      setCurrentUserId(userId);\n\n      const { data: profileData }"""
          new = """      const userId = await getCurrentUserId();\n      setCurrentUserId(userId);\n      const blockedUserIds = await getBlockedUserIds(userId);\n\n      const { data: profileData }"""
          if old in s:
              s = s.replace(old, new, 1)

          old = """        data.map(async (post: any) => {"""
          new = """        data.filter((post: any) => !post.user_id || !blockedUserIds.has(post.user_id)).map(async (post: any) => {"""
          if old in s:
              s = s.replace(old, new, 1)

          # second comment mapping belongs to post comments
          marker = """            comments = commentData.map((comment: any) => ({"""
          replacement = """            comments = commentData\n              .filter((comment: any) => !comment.user_id || !blockedUserIds.has(comment.user_id))\n              .map((comment: any) => ({"""
          if marker in s:
              s = s.replace(marker, replacement, 1)

          old = """      const reviewPosts: Post[] = (reviewData ?? []).map((review: any) => ({"""
          new = """      const reviewPosts: Post[] = (reviewData ?? [])\n        .filter((review: any) => !review.user_id || !blockedUserIds.has(review.user_id))\n        .map((review: any) => ({"""
          if old in s:
              s = s.replace(old, new, 1)

          old = """      const remoteQuotePosts: Post[] = (remoteQuotes.data ?? []).map(quote => ({"""
          new = """      const remoteQuotePosts: Post[] = (remoteQuotes.data ?? [])\n        .filter(quote => !quote.user_id || !blockedUserIds.has(quote.user_id))\n        .map(quote => ({"""
          if old in s:
              s = s.replace(old, new, 1)

          old = """      const rawStories = (data || []) as Story[];\n      const storyUserIds = Array.from(new Set(rawStories.map((story) => story.user_id).filter((id): id is string => !!id)));"""
          new = """      const rawStories = (data || []) as Story[];\n      const storyViewerId = await getCurrentUserId();\n      const blockedUserIds = await getBlockedUserIds(storyViewerId);\n      const visibleStories = rawStories.filter((story) => !story.user_id || !blockedUserIds.has(story.user_id));\n      const storyUserIds = Array.from(new Set(visibleStories.map((story) => story.user_id).filter((id): id is string => !!id)));"""
          if old in s:
              s = s.replace(old, new, 1)

          old = """      const preparedStories = rawStories.map((story) => {"""
          new = """      const preparedStories = visibleStories.map((story) => {"""
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - run: npm ci
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/index.tsx
          git commit -m "Filter blocked users from home content"
          git rm .github/workflows/add-block-filtering.yml
          git commit -m "Remove temporary block filtering patch"
          git push origin main
