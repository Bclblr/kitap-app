name: Apply home feed batching
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-home-feed-batching.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply batching patch
        run: python3 scripts/optimize-home-feed.py
      - run: npm ci
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Route audit
        run: npm run audit:routes
      - name: Reader security tests
        run: npm run test:security
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/index.tsx
          git commit -m "Batch home feed interaction queries" || true
          git rm scripts/optimize-home-feed.py .github/workflows/apply-home-feed-batching.yml
          git commit -m "Remove temporary home feed patch files" || true
          git push
