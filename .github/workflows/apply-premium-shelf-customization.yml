name: Apply Premium shelf customization

on:
  push:
    paths:
      - '.github/workflows/apply-premium-shelf-customization.yml'
      - 'scripts/patch-premium-shelf-customization.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python scripts/patch-premium-shelf-customization.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/premium.tsx src/app/_layout.tsx src/app/shelves.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Apply Premium shelf customization"
          git push origin main
