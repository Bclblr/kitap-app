name: Wire book discovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/components/BookDiscoveryRecommendations.tsx'
      - '.github/workflows/wire-book-discovery.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Add discovery recommendations to book detail
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/book.tsx')
          s=p.read_text()
          imp="import BookDiscoveryRecommendations from '@/components/BookDiscoveryRecommendations';\n"
          anchor="import BookCover from '@/components/BookCover';\n"
          if "BookDiscoveryRecommendations" not in s:
              s=s.replace(anchor, anchor+imp, 1)
          target='''          {description ? (\n            <View style={styles.descriptionBox}>\n              <View style={styles.sectionHeadingRow}>\n                <Text style={styles.sectionTitle}>Kitap Hakkında</Text>\n                <Feather name="align-left" size={17} color="#747B88" />\n              </View>\n              <Text style={styles.description}>{description}</Text>\n            </View>\n          ) : null}\n\n          <Pressable onPress={() => void addToShelf()}'''
          replacement='''          {description ? (\n            <View style={styles.descriptionBox}>\n              <View style={styles.sectionHeadingRow}>\n                <Text style={styles.sectionTitle}>Kitap Hakkında</Text>\n                <Feather name="align-left" size={17} color="#747B88" />\n              </View>\n              <Text style={styles.description}>{description}</Text>\n            </View>\n          ) : null}\n\n          {key ? (\n            <BookDiscoveryRecommendations\n              bookKey={key}\n              title={book.title ?? 'Bilinmeyen kitap'}\n              author={authorNames}\n            />\n          ) : null}\n\n          <Pressable onPress={() => void addToShelf()}'''
          if '<BookDiscoveryRecommendations' not in s:
              if target not in s:
                  raise SystemExit('Book detail insertion anchor not found')
              s=s.replace(target,replacement,1)
          p.write_text(s)
          PY
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Route audit
        run: npm run audit:routes
      - name: Reader security tests
        run: npm run test:security
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/book.tsx
          git diff --cached --quiet || git commit -m 'Show discovery recommendations on book detail'
          git push
