name: Add notification settings
on:
  push:
    paths:
      - 'scripts/add-notification-settings.cjs'
      - '.github/workflows/add-notification-settings.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply notification settings integration
        run: node scripts/add-notification-settings.cjs
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Route audit
        run: npm run audit:routes
      - name: Reader security tests
        run: npm run test:security
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/profile-settings.tsx src/app/notifications.tsx
          git diff --cached --quiet || git commit -m 'Integrate notification preferences'
          git push
