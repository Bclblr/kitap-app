name: Complete reading loop
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/complete-reading-loop.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply reading completion patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/read.tsx')
          s=p.read_text()
          old="""      await loadReadingDashboard();\n\n      Alert.alert('Güncellendi', 'Okuma ilerlemen kaydedildi.');\n"""
          new="""      await loadReadingDashboard();\n\n      if (updatedProgress.current_page >= updatedProgress.total_pages) {\n        const { error: statusError } = await supabase.rpc('set_user_book_status', {\n          p_book_key: currentBook.key,\n          p_book_title: currentBook.title ?? '',\n          p_status: 'read',\n        });\n\n        if (statusError) {\n          console.error('Kitap tamamlandı olarak işaretlenemedi:', statusError);\n          Alert.alert(\n            'İlerleme kaydedildi',\n            'Sayfa ilerlemen kaydedildi ancak kitap Okudum rafına taşınamadı.'\n          );\n          return;\n        }\n\n        await loadReadingBooks();\n        Alert.alert(\n          'Kitap tamamlandı 🎉',\n          'Tebrikler! Kitap otomatik olarak Okudum rafına taşındı.'\n        );\n        return;\n      }\n\n      Alert.alert('Güncellendi', 'Okuma ilerlemen kaydedildi.');\n"""
          if old not in s:
              raise SystemExit('save progress anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: npm ci
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Route audit
        run: npm run audit:routes
      - name: Reader security tests
        run: npm run test:security
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/read.tsx
          git commit -m "Complete reading progress loop" || true
          git rm .github/workflows/complete-reading-loop.yml
          git commit -m "Remove temporary reading completion workflow" || true
          git push
